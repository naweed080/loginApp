<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>please login to app </h1>
    <h3>This is the best app ever!</h3>

    <div>
        <form>
            <label>Username</label>
            <input type="text" placeholder="example@gmail.com">
            <p>Your unique username to app </p>
            <br>
            <label>Password</label>
            <input type="password" placeholder="enter password">
            <p>Your strong password </p>
            <br>
            <label id="label" >Remember me</label>
            <input  type="checkbox">
            <p>(if this is a private computer)</p>
            <button type="submit">Login</button>
            <button type="button">Register</button>

        </form>
    </div>
    <p id="p-a">Copyright &#169 2026. All rights reserved. Template by Colorlib</p>

</body>

</html>
